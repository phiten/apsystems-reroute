name: "APSystems Reroute"
version: "1.3.0"
slug: "apsystems_reroute"
description: "Redirects APsystems MQTT connections to a broker you control."
url: "https://github.com/phiten/apsystems-reroute"
# aarch64 only, and that is not laziness. The iptables compatibility this add-on
# depends on (container 1.8.13 nf_tables against the host's 1.8.11 nf_tables) was
# verified on an aarch64 HAOS host. On an amd64 host running the legacy backend,
# the container would write into the nf_tables view that the host does not
# consult - and the redirect would silently not happen. Shipping an arch nobody
# has built and run attracts exactly the users it fails for. See DOCS.md.
arch:
  - aarch64
  - amd64
init: false
# host_network + NET_ADMIN are mandatory: without the host network namespace the
# container would write its iptables rule into its own netns, where it does
# nothing at all.
host_network: true
privileged:
  - NET_ADMIN
# share:rw for the state file that Home Assistant reads. ssl:ro for the broker's
# certificate, which capture mode has to present -- read-only, because this
# add-on has no business writing there.
map:
  - share:rw
  - ssl:ro
# boot: auto is mandatory rather than a preference. The host has -P FORWARD DROP.
# If it reboots while the route in your router is active and this add-on does not
# come up with it, the inverter's packets fall into the forward path and are
# dropped - the device then reaches neither your broker nor the vendor.
boot: auto
startup: services
options:
  source_ip: ""
  dns_name: "data.mqtt.apsystemsema.com"
  vendor_ip: ""
  broker_ip: ""
  port: 9005
  check_interval: 60
  capture_credentials: false
  certfile: ""
  keyfile: ""
# match() rather than str: source_ip accepts comma-separated IPv4 addresses,
# and the empty alternative enables auto-detection. Whitespace around commas
# is accepted and normalized before the addresses reach iptables.
schema:
  source_ip: 'match(^$|^[0-9]{1,3}(\.[0-9]{1,3}){3}(\s*,\s*[0-9]{1,3}(\.[0-9]{1,3}){3})*$)'
  dns_name: str
  vendor_ip: 'match(^$|^[0-9]{1,3}(\.[0-9]{1,3}){3}$)'
  broker_ip: 'match(^$|^[0-9]{1,3}(\.[0-9]{1,3}){3}$)'
  port: port
  check_interval: int(10,3600)
  capture_credentials: bool
  # Bare filenames under /ssl, no slashes: these are interpolated into a path,
  # and there is no reason for this add-on to read anything outside that folder.
  certfile: 'match(^$|^[A-Za-z0-9._-]+$)'
  keyfile: 'match(^$|^[A-Za-z0-9._-]+$)'
